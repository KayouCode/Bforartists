name: LeStudio Mesa LLVMpipe GUI capture

on:
  push:
    branches:
      - codex/mission10d-capture-63a1b717
    paths:
      - .github/workflows/windows-gui-capture.yml
      - scripts/windows-gui-capture.ps1
  workflow_dispatch:
    inputs:
      package_run_id:
        description: "Successful Windows complete-package build run ID"
        required: true

permissions:
  contents: read
  actions: read

jobs:
  capture:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - name: Checkout diagnostic revision
        uses: actions/checkout@v4

      - name: Download existing autonomous package
        uses: actions/download-artifact@v4
        with:
          name: windows-lestudio-complete-package
          path: package-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 43589347831

      - name: Deploy Mesa locally, verify OpenGL, and capture
        id: capture
        shell: pwsh
        run: '& .\scripts\windows-gui-capture.ps1'

      - name: Verify approved native GUI integration test
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'extracted\bforartists.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw 'Extracted application unavailable' }
          $test = Join-Path $PWD 'lestudio_native_ui_regression.py'
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/KayouCode/Bforartists/12be9d6ecdd73197b8392c54f5f0b9e9c7c084ae/tests/python/lestudio_native_ui_regression.py' -OutFile $test
          $text = [System.IO.File]::ReadAllText($test).Replace("`r`n","`n")
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($text)
          $hash = [Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData($bytes))
          if ($hash -ne 'ADEF25FE9ACFD9AD1908936946ADA2A2603B50C34C1858E51B9F35DDF00C297F') { throw 'Approved regression script mismatch' }
          $profile = Join-Path $PWD 'native-test-profile'
          foreach ($entry in @{APPDATA='roaming'; BLENDER_USER_CONFIG='config'; BLENDER_USER_RESOURCES='resources'; BLENDER_USER_SCRIPTS='scripts'; BLENDER_USER_EXTENSIONS='extensions'; BLENDER_USER_DATAFILES='datafiles'; TEMP='temp'; TMP='temp'}.GetEnumerator()) {
            $path = Join-Path $profile $entry.Value
            New-Item -ItemType Directory -Force $path | Out-Null
            [Environment]::SetEnvironmentVariable($entry.Key,$path,'Process')
          }
          $env:GALLIUM_DRIVER='llvmpipe'
          $env:LIBGL_ALWAYS_SOFTWARE='true'
          $output = Join-Path $PWD 'capture\native-ui'
          $proc = Start-Process -FilePath $exe -ArgumentList "--factory-startup --gpu-backend opengl --python `"$test`" -- `"$output`"" -WindowStyle Maximized -RedirectStandardOutput 'capture\native-ui-stdout.log' -RedirectStandardError 'capture\native-ui-stderr.log' -PassThru
          if (-not $proc.WaitForExit(120000)) { Stop-Process -Id $proc.Id -Force; throw 'Native integration test timed out' }
          $report = Get-Content -LiteralPath (Join-Path $output 'native-ui.json') -Raw | ConvertFrom-Json
          if ($report.status -ne 'NATIVE_UI_INTEGRATION_PASS') { throw "Native integration result: $($report.status)" }

      - name: Record diagnostic status
        if: always()
        shell: pwsh
        run: |
          "capture_step_outcome=${{ steps.capture.outcome }}" | Set-Content capture\workflow-status.txt

      - name: Publish Mesa capture diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lestudio-mesa-llvmpipe-capture
          path: capture
          retention-days: 30
          if-no-files-found: error
