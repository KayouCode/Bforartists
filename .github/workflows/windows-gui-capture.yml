name: LeStudio Mesa LLVMpipe GUI capture

on:
  push:
    branches:
      - codex/mission10d-capture-63a1b717
    paths:
      - .github/workflows/windows-gui-capture.yml
      - scripts/windows-gui-capture.ps1
  workflow_dispatch:
    inputs:
      package_run_id:
        description: "Successful Windows complete-package build run ID"
        required: true

permissions:
  contents: read
  actions: read

jobs:
  capture:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - name: Checkout diagnostic revision
        uses: actions/checkout@v4

      - name: Download existing autonomous package
        uses: actions/download-artifact@v4
        with:
          name: windows-lestudio-complete-package
          path: package-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 43353970597

      - name: Deploy Mesa locally, verify OpenGL, and capture
        id: capture
        shell: pwsh
        run: '& .\scripts\windows-gui-capture.ps1'

      - name: Record diagnostic status
        if: always()
        shell: pwsh
        run: |
          "capture_step_outcome=${{ steps.capture.outcome }}" | Set-Content capture\workflow-status.txt

      - name: Publish Mesa capture diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lestudio-mesa-llvmpipe-capture
          path: capture
          retention-days: 30
          if-no-files-found: error
